[project]
name = "q2-classo"
authors = [
	{ name = "Oleg Vlasovets", email = "oleg.vlasovetc@gmail.com" }
]
description = "A QIIME 2 plugin for classification and regression using the classo method."
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
dynamic = ["version"]
requires-python = ">=3.10"

# Runtime dependencies. QIIME 2 itself, q2templates and q2-types are supplied by
# the distribution and are deliberately absent -- pinning them here would fight
# the conda environment.
#
# c-lasso is pinned exactly: it has no conda-forge package, no upper bounds in
# its own metadata, and a release history (0.3.1.77, 1.0.0.9, ...) with no semver
# discipline, so a floating pin is a liability. 1.0.11 additionally requires the
# np.infty shim in q2_classo/_numpy_compat.py to run at all under numpy 2 --
# drop the shim only when the pin moves to a release that has the fix.
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "numba>=0.60",
    "pandas>=2.2,<3",
    # zarr 3 removed zarr.hierarchy.Group, which the transformers are annotated
    # with; 2.18.3 is the first release whose __array__ accepts numpy 2's copy=.
    "zarr>=2.18.3,<3",
    "numcodecs>=0.13,<0.16",
    "plotly>=6,<7",
    "c-lasso==1.0.11",
    "scikit-bio>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.1", "ruff"]

[project.urls]
Homepage = "https://qiime2.org"
Repository = "https://github.com/Vlasovets/q2-classo"

[project.entry-points.'qiime2.plugins']
"q2-classo" = "q2_classo.plugin_setup:plugin"

[build-system]
requires = [
	"setuptools",
	"versioningit",
	"wheel"
]
build-backend = "setuptools.build_meta"

[tool.versioningit.vcs]
method = "git-archive"
describe-subst = "$Format:%(describe)$"
default-tag = "0.0.1"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.write]
file = "q2_classo/_version.py"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["q2_classo*"]

[tool.setuptools.package-data]
q2_classo = ["**/*"]
