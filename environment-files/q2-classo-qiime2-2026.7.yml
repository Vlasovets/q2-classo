# q2-classo on QIIME 2 2026.7.
#
# Two upstream renames landed in 2026.4 and are baked into this file:
#   * the `amplicon` distribution is now called `qiime2`, so the channel path is
#     .../2026.7/qiime2/released (not .../amplicon/released)
#   * the distribution metapackage is `rachis-qiime2` (verified against the
#     channel repodata), not `qiime2-amplicon`
#
# The 2025.4 file installed q2-classo and c-lasso from git branches. Those pip
# lines are gone deliberately -- pinning an upstream branch is not reproducible.
# c-lasso now comes from PyPI at an exact release; it has no conda-forge package,
# which is why it stays under `pip:` rather than moving to `dependencies:`.
#
# KNOWN UPSTREAM ISSUE: the official 2026.7 linux-64 distribution file is
# internally unsatisfiable (it pins zlib=1.3.2 while sortmerna=2.0, pulled in by
# deblur, requires zlib <1.3.0a0). If `conda env create` fails on
# `deblur -> sortmerna`, use the pruned file generated by
# q2-hdstats-recompute/scripts/make_env_yml.py instead.

name: q2-classo-qiime2-2026.7

channels:
  - https://packages.qiime2.org/qiime2/2026.7/qiime2/released
  - conda-forge
  - bioconda

dependencies:
  - rachis-qiime2
  # Not shipped by the distribution -- these are ours.
  - plotly>=6,<7
  # zarr 3 removed zarr.hierarchy.Group (used in the transformer annotations);
  # 2.18.3 is the first release whose __array__ accepts numpy 2's copy= keyword.
  - zarr>=2.18.3,<3
  - numcodecs>=0.13,<0.16
  - pip
  - pip:
    - c-lasso==1.0.11
